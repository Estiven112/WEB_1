<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Creador de Productos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-light">

    <div class="container mt-5">
        <div class="row">
            <div class="col-md-4">
                <div class="card shadow p-4">
                    <h3>Nuevo Producto</h3>
                    <div class="mb-3">
                        <label class="form-label">Nombre</label>
                        <input type="text" id="nombre" class="form-control" placeholder="Ej: Monitor Gamer">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Precio</label>
                        <input type="number" id="precio" class="form-control" placeholder="0.00">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Cantidad</label>
                        <input type="number" id="cantidad" class="form-control" placeholder="Ej: 3">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">URL Imagen</label>
                        <input type="text" id="imagen" class="form-control" placeholder="https://link-de-la-imagen.com">
                    </div>
                    <button id="btnCrear" class="btn btn-primary w-100">Crear Producto</button>
                </div>
            </div>

            <div class="col-md-8">
                <div id="contenedorProductos" class="row row-cols-1 row-cols-md-2 g-4">
                    </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
